<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WhiteShadow-MD MiniBot</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Orbitron', monospace;
  margin:0; overflow:hidden;
  height:100vh; display:flex; justify-content:center; align-items:center;
  background: radial-gradient(circle at center, #0f0f23, #16213e, #1a0b2e);
}

#bg-video {
  position: fixed; top:0; left:0; width:100%; height:100%;
  object-fit:cover; z-index:-2;
  filter: brightness(0.25) contrast(1.2) saturate(1.8);
}

.star {
  position:absolute; border-radius:50%;
  background: radial-gradient(circle, #ffd700, #ff69b4, transparent);
  animation: twinkle linear infinite;
}
@keyframes twinkle {0%,100%{opacity:0.1;}50%{opacity:1;}}

.sparkle {
  position:absolute; width:3px;height:3px;border-radius:50%;background:#ff69b4;
  animation: spin 1.5s linear infinite;
}
@keyframes spin {0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

.pair-box {
  position:relative; z-index:10;
  background: rgba(26,11,46,0.85); backdrop-filter: blur(20px);
  border-radius:2rem; padding:2rem; width:90%; max-width:420px; text-align:center;
  box-shadow: 0 0 25px #ff69b4, 0 0 50px #ffd700;
}

.neon-text {
  background: linear-gradient(90deg,#ffd700,#ff69b4,#98fb98,#dda0dd);
  -webkit-background-clip:text; color:transparent;
  animation: pulse 4s ease-in-out infinite; font-weight:900;
}
@keyframes pulse {0%,100%{filter:brightness(1) hue-rotate(0deg);}50%{filter:brightness(1.5) hue-rotate(120deg);}}

.pair-input {width:100%;padding:1rem;margin-top:1rem;border-radius:1rem;border:2px solid rgba(255,215,0,0.3);background:rgba(255,255,255,0.1);color:white;font-size:1rem;}
.pair-input:focus{outline:none;border-color:#ff69b4;box-shadow:0 0 15px #ff69b4;}

.pair-btn {width:100%;margin-top:1rem;padding:1rem;border-radius:1rem;font-weight:bold;background:linear-gradient(90deg,#ffcd3c,#ff6ec7,#9af98c);color:white;cursor:pointer;transition:all 0.3s;}
.pair-btn:hover{transform:scale(1.05) rotate(1deg);box-shadow:0 0 25px #ff69b4,0 0 50px #ffd700;}

.loader {display:inline-block;width:20px;height:20px;border:3px solid rgba(255,215,0,0.3);border-top-color:#ff69b4;border-radius:50%;animation: spin 1s linear infinite;margin-right:0.5rem;}

/* 🦄 Unicorn runners bottom */
.unicorn-run {position:absolute;bottom:10px;width:40px;height:30px;background:#ff69b4;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;animation:gallop 2s ease-in-out infinite;z-index:5;}
.unicorn-run::before {content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid #ffd700;}
.unicorn-run::after {content:'';position:absolute;bottom:-8px;left:10px;width:6px;height:12px;background:#ffd700;border-radius:3px;animation:gallop 2s ease-in-out infinite reverse;}

@keyframes gallop {
  0%,100%{transform:translateX(0);}
  50%{transform:translateX(15px);}
}

/* Footer */
.footer {
  position: fixed; bottom:0; left:0; width:100%;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
  display:flex; justify-content:center; align-items:center; gap:1rem; padding:0.8rem 0;
  color:#fff; font-family: 'Orbitron', monospace; z-index:20;
  font-size:0.85rem;
}
.footer a {color:#fff; transition:0.3s;}
.footer a:hover {color:#ff69b4;}
.footer i {font-size:1.2rem;}
</style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline>
  <source src="https://files.catbox.moe/aq6kcu.mp4" type="video/mp4">
</video>

<div id="stars-container"></div>
<div id="sparkles-container"></div>

<!-- Unicorn runners -->
<div id="unicorn-runner"></div>

<div class="pair-box">
  <h1 class="text-3xl neon-text mb-4">WhiteShadow-MD MiniBot</h1>
  <p class="mb-4 text-yellow-300 font-bold">Enter WhatsApp number to get pairing code</p>
  <input id="number" class="pair-input" placeholder="+94XXXXXXXXX" type="text" />
  <button id="submit" class="pair-btn">⟐ Get Code ⟐</button>

  <div id="waiting-message" class="mt-4 hidden flex items-center justify-center text-yellow-300">
    <span class="loader"></span> Fetching magical code...
  </div>

  <div id="pair" class="mt-4 text-lg text-white"></div>
</div>

<!-- Footer -->
<div class="footer">
  <a href="https://whatsapp.com/channel/0029Vb4bj5zI7BeFm6aM8O1p" target="_blank"><i class="fab fa-whatsapp"></i></a>
  <a href="mailto:whiteshadow2008cn@gmail.com"><i class="fas fa-envelope"></i></a>
  <span>Powered by WhiteShadow</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
// Stars
const starsContainer = document.getElementById('stars-container');
for(let i=0;i<100;i++){
  const star=document.createElement('div');
  star.classList.add('star');
  const size=Math.random()*3+1;
  star.style.width=`${size}px`;
  star.style.height=`${size}px`;
  star.style.left=`${Math.random()*100}%`;
  star.style.top=`${Math.random()*100}%`;
  star.style.animationDuration=`${Math.random()*4+2}s`;
  starsContainer.appendChild(star);
}

// Sparkles
const sparklesContainer = document.getElementById('sparkles-container');
for(let i=0;i<30;i++){
  const sp=document.createElement('div');
  sp.className='sparkle';
  sp.style.left=`${Math.random()*100}%`;
  sp.style.top=`${Math.random()*100}%`;
  sp.style.animationDuration=`${Math.random()*3+1}s`;
  sparklesContainer.appendChild(sp);
}

// Unicorn runners
const runnerContainer=document.getElementById('unicorn-runner');
for(let i=0;i<4;i++){
  const uni=document.createElement('div');
  uni.className='unicorn-run';
  uni.style.left=`${i*20}%`;
  uni.style.animationDelay=`${i*0.5}s`;
  runnerContainer.appendChild(uni);
}

// Pairing logic
const submitBtn=document.getElementById("submit");
const inputNum=document.getElementById("number");
const pairOutput=document.getElementById("pair");
const waitingMessage=document.getElementById("waiting-message");

async function Copy(){
  const obj=document.getElementById("copy");
  const text=obj.innerText.replace('CODE: ','');
  await navigator.clipboard.writeText(text);
  obj.innerHTML=`<i class="fas fa-check-circle mr-2"></i> COPIED ⟐`;
  setTimeout(()=>location.reload(),2000);
}

submitBtn.addEventListener("click",async()=>{
  const number=inputNum.value.replace(/[^0-9]/g,'');
  if(!number||number.length<11){
    pairOutput.innerHTML=`<div class="text-red-400 font-black animate-pulse">❌ Invalid number</div>`;
    return;
  }
  waitingMessage.classList.remove('hidden');
  pairOutput.innerHTML='';
  try{
    const res=await axios.get(`/code?number=${number}`);
    const code=res.data.code||`U${Math.random().toString(36).substr(2,6).toUpperCase()}`;
    waitingMessage.classList.add('hidden');
    pairOutput.innerHTML=`
      <div>
        <div class="text-4xl neon-text font-black mb-2">⟐</div>
        <div class="text-yellow-300 font-bold mb-2">Magical code generated</div>
        <div id="copy" onclick="Copy()" class="inline-block px-6 py-3 bg-black bg-opacity-10 rounded-xl border border-white border-opacity-20 cursor-pointer neon-text">
          <span class="font-black">CODE: </span><span class="font-black neon-text">${code}</span>
        </div>
        <div class="text-yellow-300 mt-2 text-sm">Click to copy code</div>
      </div>
    `;
  }catch{
    waitingMessage.classList.add('hidden');
    pairOutput.innerHTML=`<div class="text-red-400 font-black animate-pulse">❌ Failed to fetch code. Retry!</div>`;
  }
});
</script>
</body>
</html>
